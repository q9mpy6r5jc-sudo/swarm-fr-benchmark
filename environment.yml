# Environment record exported from the Python 3.12 / Conda environment used for reported runs.
# Note: Provided as a reference dependency record, not a verified minimal clean-room install.
name: swarm-fr
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - numpy>=2.0.0
  - pandas>=2.2.0
  - scipy>=1.14.0
  - scikit-learn>=1.5.0
  - statsmodels>=0.14.0
  - matplotlib>=3.9.0
  - seaborn>=0.13.0
  - scanpy>=1.10.0
  - anndata>=0.11.0
  - tqdm
  - pip
  - pip:
    - zstandard
